#!/usr/bin/env python3

"""dynamic_reconfigure definition for control_lane_node.

Generated FROM config/control_lane_node.json at build time rather than duplicating
the parameter list. The JSON already carries default/min/max/help for every knob,
which is exactly what a slider needs, so it stays the single source of truth: edit
the JSON, rebuild, and rqt_reconfigure follows.

Everything is emitted as double_t, including lane_hold_frames, because the node
coerces every parameter with float() anyway - mixing int_t in would only create a
type mismatch between the slider and the value the planner actually holds.
"""

import json
import os

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

PACKAGE = "ch3_obstacle_avoidance"

gen = ParameterGenerator()

_here = os.path.dirname(os.path.abspath(__file__))
_config = os.path.join(_here, "..", "config", "control_lane_node.json")

with open(_config, "r") as handle:
    _controller = json.load(handle)["parameters"]["controller"]

for _name, _spec in _controller.items():
    # rqt shows this on hover. Trim it: the JSON help is written as documentation
    # and some entries run to several sentences, which makes the tooltip unusable.
    _help = str(_spec.get("help", ""))
    if len(_help) > 200:
        _help = _help[:197].rsplit(" ", 1)[0] + "..."
    gen.add(
        _name,
        double_t,
        0,
        _help,
        float(_spec["default"]),
        float(_spec.get("min", 0.0)),
        float(_spec.get("max", 1.0)),
    )

exit(gen.generate(PACKAGE, "control_lane_node", "ControlLane"))
